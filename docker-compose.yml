version: '3.8'

services:
  # Federated Learning Server
  server:
    image: ${SERVER_IMAGE:-server-flwr-cpu}
    container_name: fl_server
    logging:
      driver: local
    volumes:
      # Model weights (read-write for saving/loading)
      - ./model:/app/model:rw
      # Logs (read-write)
      - ./logs:/app/logs:rw
    networks:
      - fl_network

  # Federated Learning Client Template
  # This is a template that can be scaled or instantiated per client
  client:
    image: ${CLIENT_IMAGE:-client-flwr-cpu}
    container_name: fl_client-${CID:-0}
    logging:
      driver: local
    environment:
      - CID=${CID:-0}
    volumes:
      # Model weights (read-write)
      - model_data:/app/model:rw
      # Logs (read-write)
      - log_data:/app/logs:rw
    networks:
      - fl_network
    depends_on:
      server:
        condition: service_healthy

networks:
  fl_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  model_data:
    driver: local
  log_data:
    driver: local
