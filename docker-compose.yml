services:
  # Federated Learning Server
  server:
    image: ${SERVER_IMAGE:-server-flwr-cpu}
    container_name: fl_server
    logging:
      driver: local
    volumes:
      # Model weights (bind mount from host)
      - ./model:/app/model:rw
      # Logs and datasets (bind mount from host)
      - ./logs:/app/logs:rw
    networks:
      - fl_network
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 9999), timeout=1)"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  # Federated Learning Client Template
  # This is a template that can be scaled or instantiated per client
  client:
    image: ${CLIENT_IMAGE:-client-flwr-cpu}
    container_name: fl_client-${CID:-0}
    logging:
      driver: local
    environment:
      - CID=${CID:-0}
    volumes:
      # Model weights (bind mount from host)
      - ./model:/app/model:rw
      # Logs and datasets (bind mount from host)
      - ./logs:/app/logs:rw
    networks:
      - fl_network
    depends_on:
      server:
        condition: service_healthy

networks:
  fl_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
