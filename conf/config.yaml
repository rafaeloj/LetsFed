# General Configuration
rounds: 20
n_clients: 1
init_clients: 1.0
gpu: false
log_path: logs

# Server Configuration
server:
  ip: 0.0.0.0
  port: 9999

  # Aggregation configuration
  aggregation_method:
    name: fedavg  # Options: fedavg, maxfl, qffl
    params: {}

  # Selection configuration
  selection_method:
    name: random  # Options: random, deev, poc, round_robin, letsfed
    params:
      perc_of_clients: 0.5

# Client Configuration
client:
  epochs: 10
  training_strategy:
    name: normal  # Options: normal, letsfed, maxfl, fedper, qffl
    params:
      learning_rate: 0.001
  # Metrics configuration - list of metrics to calculate
  metrics:
    - name: accuracy
      params: {}
    - name: precision
      params:
        average: macro  # Options: 'macro', 'micro', 'weighted'
        zero_division: 0  # Value to return when there is a zero division
    - name: recall
      params:
        average: macro
        zero_division: 0
    - name: f1_score
      params:
        average: weighted  # Weighted by support (number of true instances for each label)
        zero_division: 0
    - name: auc
      params:
        multi_class: ovr  # Options: 'ovr' (one-vs-rest), 'ovo' (one-vs-one)
        average: macro

# Dataset Configuration
dataset:
  dataset: fashion_mnist
  path: logs
  batch_size: 32
  shuffle_train: true
  prefetch: true

  train_partitioner:
    method: dirichlet  # Options: dirichlet, iid
    dirichlet_alpha: 1.0  # Increased from 0.1 for more balanced distribution
    partition_by: label
    self_balancing: true  # Enable self-balancing for more uniform partitions
    min_partition_size: 100  # Increased to ensure sufficient data per client
    shuffle: true

  test_partitioner:
    method: iid  # Use IID for test data to get global evaluation
    # dirichlet_alpha: 1.0
    partition_by: label
    self_balancing: false
    min_partition_size: 250  # Ensure enough test samples per client
    shuffle: true

# Model Configuration
model:
  type: dnn  # Options: dnn, cnn
  path: model
